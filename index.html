const SND_FILES={waves:90,fire:60,wind:55,trees:52,crickets:60},SND_PAD=0.1;
const Snd={ctx:null,on:true,L:{},
  start(){if(this.ctx)return;let C;try{C=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}this.ctx=C;if(C.state==='suspended')C.resume();
    const comp=C.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;comp.connect(C.destination);const master=C.createGain();master.gain.value=0.9;master.connect(comp);this.master=master;
    for(const [k,len] of Object.entries(SND_FILES)){
      const g=C.createGain();g.gain.value=0;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=18000;lp.Q.value=0.5;lp.connect(g).connect(master);
      const L=this.L[k]={g,lp,ready:false};
      fetch('snd/'+k+'.mp3').then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>C.decodeAudioData(ab,res,rej))).then(buf=>{
        const s=C.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=SND_PAD;s.loopEnd=SND_PAD+len;s.connect(lp);s.start(0,SND_PAD+Math.random()*len*0.9);L.ready=true;}).catch(()=>{});}},
  update(dt,t){if(!this.ctx)return;
    // 장소별 비율 (lp: 높을수록 가까이, 낮으면 멀리서 들리는 소리)
    let m;
    if(placeKey==='beach'){const d=me?Math.hypot((me.x-52)*AR,me.y-63):40;const f=Math.max(0,1-d/45);
      m={waves:[0.95-0.45*f,18000],fire:[1.8*f,18000],wind:[0.22,18000],trees:[0.1,6000],crickets:[0.04,9000]};}
    else if(placeKey==='library'){const d=me?Math.hypot((me.x-25)*AR,me.y-56):40;const f=Math.max(0,1-d/38);
      m={waves:[0.12,500],fire:[0.25+1.4*f,18000],wind:[0.1,1200],trees:[0.16,2200],crickets:[0.03,3000]};}
    else m={waves:[0.32,650],fire:[0,18000],wind:[0.12,2500],trees:[0.5,18000],crickets:[0.18,18000]};
    const k=Math.min(1,dt*1.2);
    for(const n in this.L){const L=this.L[n],[v,f]=m[n]||[0,18000];const tv=this.on?v:0;
      L.g.gain.value+=(tv-L.g.gain.value)*k;L.lp.frequency.value+=(f-L.lp.frequency.value)*k;}}};

    const t2=document.createElement('h4');t2.textContent='색';body.appendChild(t2);const g2=document.createElement('div');g2.className='grid';
    PAL[w.key].c.forEach((col,i)=>{const b=document.createElement('button');b.className='sw'+(look[w.key]===i?' on':'');b.style.background=col;b.setAttribute('aria-label',w.label+' 색 '+(i+1));
      b.addEventListener('pointerup',e=>{e.stopPropagation();look[w.key]=i;previewLook(look);setLook(me,look);g2.querySelectorAll('.sw').forEach((x,j)=>x.classList.toggle('on',j===i));});g2.appendChild(b);});body.appendChild(g2);}
  draw();
  dressEl.querySelector('.done').addEventListener('pointerup',e=>{e.stopPropagation();dressEl.style.display='none';saveLook(me.look);if(pv){pv.r.dispose();pv=null;}Net.write({tx:+me.x.toFixed(2),ty:+me.y.toFixed(2),seat:me.seat?P.seats.indexOf(me.seat):-1});});
  dressEl.style.display='flex';}
dressEl.addEventListener('pointerup',e=>e.stopPropagation());
dressBtn.addEventListener('pointerup',e=>{e.stopPropagation();openDress();});
/* ===================== 9. 게임 루프 ===================== */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(me){stepChar(me,dt);checkExit();}
  npcs.forEach(c=>{npcThink(c,dt);stepChar(c,dt);});Net.peers.forEach(c=>stepChar(c,dt));Net.tick();
  [me,...npcs,...Net.peers.values()].forEach(c=>{if(c){c._dt=dt;place(c,t);}});
  let lx=0,ly=0;if(me&&me.target&&!me.sitting&&P.charVh){const dx=(me.target[0]-me.x)/100*SW,dy=(me.target[1]-me.y)/100*SH,d=Math.hypot(dx,dy)||1;lx=dx/d*innerWidth*0.14;ly=dy/d*innerHeight*0.12;}
  leadX+=(lx-leadX)*Math.min(1,dt*1.6);leadY+=(ly-leadY)*Math.min(1,dt*1.6);
  const fx0=(me?me.x/100*SW:SW/2)+leadX,fy0=(me?me.y/100*SH-charH(me.y)*0.4:SH/2)+leadY;
  const tx=Math.max(0,Math.min(SW-innerWidth,fx0-innerWidth/2)),ty=Math.max(0,Math.min(SH-innerHeight,fy0-innerHeight/2));
  if(snapPan&&me){panX=tx;panY=ty;snapPan=false;leadX=leadY=0;}else{const k=1-Math.pow(0.0025,dt);panX+=(tx-panX)*k;panY+=(ty-panY)*k;}stage.style.transform=`translate(${-panX}px,${-panY}px)`;setCam(panX,panY);
  if(P.fg)fgEl.style.transform=`translate(${-panX*P.fg}px,${-panY*P.fg}px)`;
  updateSeats();bobCandles(t);Snd.update(dt,t);bgMat.uniforms.uTime.value=t;{const u=VIDU.uVidOn,g=(vidWant&&vidOk&&!vidEl.paused&&vidEl.readyState>=2)?1:0;u.value+=(g-u.value)*Math.min(1,dt*2.5);if(u.value<0.002)u.value=0;}renderer.render(scene,camera);previewFrame(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
