    else if(placeKey==='camp')m={waves:[0.12,900],fire:[0,18000],wind:[0.34,900],trees:[0.2,1200],crickets:[0.3,1400]};
    else if(placeKey==='post')m={waves:[0.04,380],fire:[0,18000],wind:[0.1,1100],trees:[0.14,1600],crickets:[0.03,2000]};
    else if(placeKey==='curio')m={waves:[0.05,380],fire:[0,18000],wind:[0.06,900],trees:[0.12,1400],crickets:[0.03,2000]};
    else m={waves:[0.32,650],fire:[0,18000],wind:[0.12,2500],trees:[0.5,18000],crickets:[0.18,18000]};
    const k=Math.min(1,dt*1.2);
    for(const n in this.L){const L=this.L[n],[v,f]=m[n]||[0,18000];const tv=this.on?v:0;
      L.g.gain.value+=(tv-L.g.gain.value)*k;L.lp.frequency.value+=(f-L.lp.frequency.value)*k;}}};
const sndBtn=document.getElementById('sndBtn');
sndBtn.addEventListener('pointerup',e=>{e.stopPropagation();Snd.on=!Snd.on;sndBtn.querySelector('img').src=Snd.on?'ui/i_snd_on.webp':'ui/i_snd_off.webp';if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume();try{localStorage.setItem('ev_snd',Snd.on?'1':'0');}catch(_){}});
try{if(localStorage.getItem('ev_snd')==='0'){Snd.on=false;sndBtn.querySelector('img').src='ui/i_snd_off.webp';}}catch(_){}
document.addEventListener('visibilitychange',()=>{if(!Snd.ctx)return;if(document.hidden)Snd.ctx.suspend();else Snd.ctx.resume();});
/* ===================== 8-b. 꾸미기 ===================== */
const dressEl=document.getElementById('dress'),dressBtn=document.getElementById('dressBtn');
function loadLook(){try{return JSON.parse(localStorage.getItem('ev_look')||'null');}catch(e){return null;}}
function saveLook(l){try{localStorage.setItem('ev_look',JSON.stringify(l));}catch(e){}}
// 옷장 구조: 카테고리마다 "스타일"(나중에 디자인한 옷·머리 추가 자리) + "색"
const WARDROBE=[{key:'h',label:'머리',styles:[{id:'basic',name:'기본 머리'}]},
  {key:'s',label:'윗옷',styles:[{id:'basic',name:'기본 티셔츠'}]},
  {key:'p',label:'바지',styles:[{id:'basic',name:'기본 바지'}]},
  {key:'o',label:'신발',styles:[{id:'basic',name:'기본 신발'}]},
  {key:'k',label:'피부',styles:null}];
let pv=null;
function initPreview(canvas){const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});r.useLegacyLights=true;r.setPixelRatio(Math.min(2,devicePixelRatio));r.setClearColor(0,0);
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xfff2e6,0x8a6a70,0.8));const k=new THREE.DirectionalLight(0xffd2a8,0.7);k.position.set(1,1.4,1.2);sc.add(k);
  const cam=new THREE.PerspectiveCamera(26,1,0.1,50);cam.position.set(0,0.75,3.6);cam.lookAt(0,0.42,0);
  const cm=charMaterial();const body=gltf.scene.clone(true);body.traverse(o=>{if(o.isMesh){o.material=cm.m;o.frustumCulled=false;}});body.position.y=0.5;
  const spin=new THREE.Group();spin.add(body);sc.add(spin);
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.32,24),new THREE.MeshBasicMaterial({color:0x5a3f46,transparent:true,opacity:0.18}));shadow.rotation.x=-Math.PI/2;shadow.position.y=0.002;sc.add(shadow);
  pv={r,sc,cam,spin,body,u:cm.u,ang:-1.2,drag:null,canvas};
  canvas.addEventListener('pointerdown',e=>{pv.drag={x:e.clientX,a:pv.ang};canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(pv.drag)pv.ang=pv.drag.a+(e.clientX-pv.drag.x)*0.012;});
  canvas.addEventListener('pointerup',()=>{pv.drag=null;});}
function previewLook(look){if(!pv)return;const fake={u:pv.u};setLook(fake,look);}
function previewFrame(t){if(!pv||dressEl.style.display!=='flex')return;const c=pv.canvas;const w=c.clientWidth,hh=c.clientHeight;
  if(pv.w!==w||pv.h!==hh){pv.w=w;pv.h=hh;pv.r.setSize(w,hh,false);pv.cam.aspect=w/hh;pv.cam.updateProjectionMatrix();}
  if(!pv.drag)pv.ang+=0.004;pv.spin.rotation.y=pv.ang;pv.body.position.y=0.5+Math.sin(t*2.2)*0.008;pv.r.render(pv.sc,pv.cam);}
function openDress(){const look=Object.assign({h:0,s:0,p:0,k:0,o:0},me.look);let tab=0;
  dressEl.innerHTML='<div class="stage"><canvas></canvas><div class="ttl">'+me.name+'의 옷장</div><div class="hint">좌우로 밀면 돌아가요</div></div><div class="tabs"></div><div class="body"></div><div class="foot"><button class="done">다 골랐어</button></div>';
  initPreview(dressEl.querySelector('canvas'));previewLook(look);
  const tabs=dressEl.querySelector('.tabs'),body=dressEl.querySelector('.body');
  function draw(){tabs.innerHTML='';WARDROBE.forEach((w,i)=>{const b=document.createElement('button');b.className='tab'+(i===tab?' on':'');b.textContent=w.label;b.addEventListener('pointerup',e=>{e.stopPropagation();tab=i;draw();});tabs.appendChild(b);});
    const w=WARDROBE[tab];body.innerHTML='';
    if(w.styles){const t=document.createElement('h4');t.textContent='스타일';body.appendChild(t);const g=document.createElement('div');g.className='grid';
      w.styles.forEach(s=>{const it=document.createElement('div');it.className='item on';it.textContent=s.name;g.appendChild(it);});
      for(let i=0;i<3;i++){const it=document.createElement('div');it.className='item soon';it.textContent='곧 추가';g.appendChild(it);}body.appendChild(g);}
    const t2=document.createElement('h4');t2.textContent='색';body.appendChild(t2);const g2=document.createElement('div');g2.className='grid';
    PAL[w.key].c.forEach((col,i)=>{const b=document.createElement('button');b.className='sw'+(look[w.key]===i?' on':'');b.style.background=col;b.setAttribute('aria-label',w.label+' 색 '+(i+1));
      b.addEventListener('pointerup',e=>{e.stopPropagation();look[w.key]=i;previewLook(look);setLook(me,look);g2.querySelectorAll('.sw').forEach((x,j)=>x.classList.toggle('on',j===i));});g2.appendChild(b);});body.appendChild(g2);}
  draw();
  dressEl.querySelector('.done').addEventListener('pointerup',e=>{e.stopPropagation();dressEl.style.display='none';saveLook(me.look);if(pv){pv.r.dispose();pv=null;}Net.write({tx:+me.x.toFixed(2),ty:+me.y.toFixed(2),seat:me.seat?P.seats.indexOf(me.seat):-1});});
  dressEl.style.display='flex';}
dressEl.addEventListener('pointerup',e=>e.stopPropagation());
dressBtn.addEventListener('pointerup',e=>{e.stopPropagation();openDress();});
/* ===================== 9. 게임 루프 ===================== */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(me){stepChar(me,dt);checkExit();}
  npcs.forEach(c=>{npcThink(c,dt);stepChar(c,dt);});Net.peers.forEach(c=>stepChar(c,dt));Net.tick();
  [me,...npcs,...Net.peers.values()].forEach(c=>{if(c){c._dt=dt;place(c,t);}});
  let lx=0,ly=0;if(me&&me.target&&!me.sitting&&P.charVh){const dx=(me.target[0]-me.x)/100*SW,dy=(me.target[1]-me.y)/100*SH,d=Math.hypot(dx,dy)||1;lx=dx/d*innerWidth*0.14;ly=dy/d*innerHeight*0.12;}
  leadX+=(lx-leadX)*Math.min(1,dt*1.6);leadY+=(ly-leadY)*Math.min(1,dt*1.6);
  const fx0=(me?me.x/100*SW:SW/2)+leadX,fy0=(me?me.y/100*SH-charH(me.y)*0.4:SH/2)+leadY;
  const tx=SW<innerWidth?(SW-innerWidth)/2:Math.max(0,Math.min(SW-innerWidth,fx0-innerWidth/2)),ty=SH<innerHeight?(SH-innerHeight)/2:Math.max(0,Math.min(SH-innerHeight,fy0-innerHeight/2));
  if(snapPan&&me){panX=tx;panY=ty;snapPan=false;leadX=leadY=0;}else{const k=1-Math.pow(0.0025,dt);panX+=(tx-panX)*k;panY+=(ty-panY)*k;}stage.style.transform=`translate(${-panX}px,${-panY}px)`;setCam(panX,panY);
  if(P.fg)fgEl.style.transform=`translate(${-panX*P.fg}px,${-panY*P.fg}px)`;
  updateSeats();bobCandles(t);tickSparks(dt);tickDoors();Owl.tick(dt);Camp.near();Snd.update(dt,t);bgMat.uniforms.uTime.value=t;{const u=VIDU.uVidOn,g=(vidWant&&vidOk&&!vidEl.paused&&vidEl.readyState>=2)?1:0;u.value+=(g-u.value)*Math.min(1,dt*2.5);if(u.value<0.002)u.value=0;}renderer.render(scene,camera);previewFrame(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
